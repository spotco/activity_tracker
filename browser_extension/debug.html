<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Activity Tracker Extension Debug</title>
    <style>
      body {
        font: 13px/1.45 Segoe UI, sans-serif;
        margin: 20px;
        max-width: 760px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      .hint {
        color: #444;
        margin-bottom: 16px;
      }
      pre {
        background: #f6f8fa;
        border: 1px solid #ddd;
        padding: 12px;
        overflow: auto;
        font: 12px/1.4 Consolas, monospace;
      }
      button {
        margin-right: 8px;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Activity Tracker extension debug</h1>
    <p class="hint">
      Open from <code>brave://extensions</code> → Activity Tracker Browser Labels →
      <strong>Extension options</strong>. Compare Extension ID with the native host
      <code>allowed_origins</code> entry.
    </p>
    <button id="refresh" type="button">Refresh</button>
    <button id="force" type="button">Force reconnect + send</button>
    <button id="probe" type="button">Run native probe</button>
    <pre id="output">Loading…</pre>
    <script type="module" src="debug.js"></script>
  </body>
</html>
